<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용자 목록</title>
</head>
<body>
    <h1>사용자 목록</h1>
    <!-- 사용자 목록이 출력될 영역 -->
    <ul id="user-list"></ul>

    <script>
        // API 기본 주소 (상수로 분리해 다른 엔드포인트에도 재사용 가능)
        const API_URL = 'https://jsonplaceholder.typicode.com';

        // 재사용 가능한 GET 요청 함수
        // - url을 받아 fetch로 요청하고, JSON으로 변환한 결과를 반환
        // - 응답 상태가 실패(response.ok === false)면 에러를 던짐
        async function fetchData(url) {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`요청 실패: ${response.status}`);
            }
            return await response.json();
        }

        // 데이터 배열을 ul 요소에 li 목록으로 출력하는 함수
        // - target: 출력할 ul 요소
        // - items: 출력할 데이터 배열
        // - format: 각 항목을 문자열로 만드는 함수 (출력 형식을 바꿔서 재사용 가능)
        function renderList(target, items, format) {
            target.innerHTML = '';
            items.forEach(item => {
                const li = document.createElement('li');
                li.textContent = format(item);
                target.appendChild(li);
            });
        }

        // 사용자 목록을 불러와 화면에 출력하는 메인 함수
        // - try/catch로 네트워크 오류나 응답 오류를 처리하고 화면에 메시지 표시
        async function showUsers() {
            const userList = document.querySelector('#user-list');
            try {
                const users = await fetchData(`${API_URL}/users`);
                renderList(userList, users, user => `${user.name} - ${user.email}`);
            } catch (error) {
                userList.innerHTML = `<li>데이터를 불러오지 못했습니다. (${error.message})</li>`;
            }
        }

        // 페이지가 로드되면 사용자 목록 출력 실행
        showUsers();
    </script>
</body>
</html>
