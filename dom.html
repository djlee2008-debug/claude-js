<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM API</title>
    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            width: 200px;
            height: 200px;
            background-color: white;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    
    <h1 id="claude"> Hello, world! </h1>
    <p class="name"> 홍길동 </p> 
    <button id="btn">이름 변경</button>

    <!-- 팝업 모달 -->
    <div id="modal" class="modal">
        <div class="modal-content">김길동</div>
    </div>

</body>
<script>
    
    const h1 = document.getElementById("claude");
    h1.innerText = "안녕~ ";

    const name = document.getElementsByClassName("name")[0];
    name.innerText = "이순신";

    const button = document.querySelector("button");
    const modal = document.getElementById("modal");

    button.addEventListener("click", (e) => {
        console.log(e);
        modal.classList.add("active");
    });

    // 팝업 외부 클릭 시 닫기
    modal.addEventListener("click", (e) => {
        if (e.target === modal) {
            modal.classList.remove("active");
        }
    });
    


</script>
</html>
